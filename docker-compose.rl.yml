version: "3.8"
services:
  # Game Server Cluster
  terraforming-mars-1:
    container_name: tm-server-1
    build:
      context: ./terraforming-mars
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - NODE_ENV=production
    volumes:
      - tm-db-1:/usr/src/app/db
    networks:
      - rl-network

  # RL Environment Controller
  rl-coordinator:
    build: ./rl-environment
    container_name: rl-coordinator
    restart: unless-stopped
    ports:
      - "5000:5000"  # API for external monitoring
      - "6006:6006"  # TensorBoard
    environment:
      - GAME_SERVERS=tm-server-1:8080
      - PUBLIC_TM_URL=http://localhost:8081
      - INTERNAL_TM_URL=http://tm-server-1:8080
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://postgres:password@postgres:5432/rl_metrics
      - TM_CARD_METADATA_PATH=/app/card_metadata.json
      - SELF_PLAY_LEARNING=1
      - SELF_PLAY_REWARD_SCALE=1.0
      - TM_FAST_MODE_OPTION=0
      - AGENT_POLL_INTERVAL_SEC=0.6
      - AGENT_POST_MOVE_SLEEP_SEC=1.2
      - AGENT_FAILURE_PAUSE_SEC=0.5
      - AGENT_STUCK_LOG_COOLDOWN_SEC=4.0
    volumes:
      - ./rl-environment:/app
      - ./rl-models:/app/rl-models
      - ./rl-logs:/app/logs
      - ./card_metadata.json:/app/card_metadata.json:ro
    depends_on:
      - redis
      - postgres
      - terraforming-mars-1
    networks:
      - rl-network

  # Redis for game state caching and job queue
  redis:
    image: redis:7-alpine
    container_name: rl-redis
    ports:
      - "6379:6379"
    networks:
      - rl-network

  # PostgreSQL for metrics and tournament results
  postgres:
    image: postgres:15-alpine
    container_name: rl-postgres
    environment:
      - POSTGRES_DB=rl_metrics
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rl-network

volumes:
  tm-db-1:
  tm-db-2:
  tm-db-3:
  postgres-data:

networks:
  rl-network:
    driver: bridge
