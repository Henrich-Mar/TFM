        - node -e "require('http').get('http://127.0.0.1:8080/',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  # Automatically restart unhealthy tfm-server containers
  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=120
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      - tfm-server-1
      - tfm-server-2
      - tfm-server-3
      - tfm-server-4
      - tfm-server-5
      - tfm-server-6
      - tfm-server-7
      - tfm-server-8
      - tfm-server-9
      - tfm-server-10
  # Redis for job queue and caching
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Database for metrics
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=tfm
      - POSTGRES_PASSWORD=tfm_password
      - POSTGRES_DB=tfm_rl
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data_hard:/var/lib/postgresql/data

  # RL Coordinator - Manages training loop
  rl-coordinator:
    build:
      context: ./rl-environment
      dockerfile: Dockerfile.training
    restart: unless-stopped
    volumes:
      - ./rl-environment:/app
      - ./rl-models:/app/rl-models
      - ./rl-logs:/app/logs
      - ./card_metadata.json:/app/card_metadata.json:ro
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql://tfm:tfm_password@postgres:5432/tfm_rl
      - GAME_SERVERS=tfm-server-1:8080,tfm-server-2:8080,tfm-server-3:8080,tfm-server-4:8080,tfm-server-5:8080,tfm-server-6:8080,tfm-server-7:8080,tfm-server-8:8080,tfm-server-9:8080,tfm-server-10:8080
      - PUBLIC_TM_MAP=tfm-server-1:8080=http://localhost:8081,tfm-server-2:8080=http://localhost:8082,tfm-server-3:8080=http://localhost:8083,tfm-server-4:8080=http://localhost:8084,tfm-server-5:8080=http://localhost:8085,tfm-server-6:8080=http://localhost:8086,tfm-server-7:8080=http://localhost:8087,tfm-server-8:8080=http://localhost:8088,tfm-server-9:8080=http://localhost:8089,tfm-server-10:8080=http://localhost:8090
      - PUBLIC_TM_SERVER_ID_MAP=tfm-server-1:8080=tfm-server-1,tfm-server-2:8080=tfm-server-2,tfm-server-3:8080=tfm-server-3,tfm-server-4:8080=tfm-server-4,tfm-server-5:8080=tfm-server-5,tfm-server-6:8080=tfm-server-6,tfm-server-7:8080=tfm-server-7,tfm-server-8:8080=tfm-server-8,tfm-server-9:8080=tfm-server-9,tfm-server-10:8080=tfm-server-10
      - PUBLIC_TM_URL=http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://localhost:8085,http://localhost:8086,http://localhost:8087,http://localhost:8088,http://localhost:8089,http://localhost:8090
      - INTERNAL_TM_URL=http://tfm-server-1:8080,http://tfm-server-2:8080,http://tfm-server-3:8080,http://tfm-server-4:8080,http://tfm-server-5:8080,http://tfm-server-6:8080,http://tfm-server-7:8080,http://tfm-server-8:8080,http://tfm-server-9:8080,http://tfm-server-10:8080
      - POPULATION_SIZE=16
      - GENERATIONS=5000
      - GAMES_PER_EVAL=8
      - TOURNAMENT_CONCURRENCY=8
      - GLOBAL_GAME_CONCURRENCY=40    # 40 games per server * 10 servers = 400 games
      - MAX_ACTIVE_GAMES_PER_SERVER=5
      - TM_GAME_TIMEOUT_SEC=360
      - TM_HTTP_CONNECTOR_LIMIT=800
      - TM_HTTP_CONNECTOR_LIMIT_PER_HOST=48
      - TM_CREATE_GAME_RETRY_ATTEMPTS=4
      - TM_CREATE_GAME_RETRY_BACKOFF_SEC=0.25
      - TM_SERVER_FAILURE_COOLDOWN_SEC=12
      - TM_HEALTH_CHECK_INTERVAL_SEC=30
      - TM_SERVER_HEALTH_TIMEOUT_SEC=3
      - TM_FAST_MODE_OPTION=1
      - RL_MODELS_DIR=/app/rl-models
      - RL_CHECKPOINT_DIR=/app/rl-models/checkpoints
      - TM_CARD_METADATA_PATH=/app/card_metadata.json
      
      # Agent Architecture (Hard Mode)
      - AGENT_HIDDEN_SIZE=512
      - AGENT_NUM_LAYERS=5
      
      # Scoring Mode
      - SCORING_MODE=HARD
      - SELECTION_RANK_1_POINTS=150
      - SELECTION_RANK_2_POINTS=50
      - SELECTION_RANK_3_POINTS=25
      - SELECTION_RANK_4_POINTS=5
      - SELECTION_INCLUDE_TRAINING_POOL=0
      
      # PPO Configuration (Aggressive)
      - PPO_ENABLE=true
      - PPO_ROLLOUT_STEPS=24576 
      - PPO_MIN_STEPS_PER_AGENT=2048
      - PPO_EPOCHS=4
      - PPO_MINIBATCH_SIZE=1024
      - PPO_ENTROPY_COEF=0.010
      - PPO_VALUE_COEF=1.0
      - PPO_TARGET_KL=0.015
      - PPO_ENTROPY_COEF_START=0.018
      - PPO_ENTROPY_COEF_END=0.006
      - PPO_ENTROPY_COEF_ANNEAL_GAMES=4000
      - PPO_LEARNING_RATE=0.00008
      - PPO_LR_MIN=0.00001
      - PPO_LR_MAX=0.00030
      - PPO_LR_ADAPT_UP=1.02
      - PPO_LR_ADAPT_DOWN=0.90
      - PPO_CLIP_EPS=0.12
      - PPO_RARE_STATE_PRIORITY_ALPHA=1.2
      - PPO_BUFFER_MAX_STEPS=400000
      - PPO_REWARD_DEBUG_ENABLED=1
      - PPO_REWARD_DEBUG_THRESHOLD=0.001
      - PPO_REWARD_DEBUG_LOG_EVERY=2000

      # Promotion Gates (stricter than defaults)
      - PROMOTION_GATE_ENABLED=true
      - GATE_MIN_CARD_PLAYS_PER_GAME=10.0
      - GATE_MAX_STANDARD_PROJECT_RATIO=0.30
      - GATE_MIN_STEEL_SPENT_PER_GAME=4.0
      - GATE_MIN_TITANIUM_SPENT_PER_GAME=2.0
      - GATE_MIN_STEEL_CONVERSION_EFFICIENCY=0.08
      - GATE_MIN_TITANIUM_CONVERSION_EFFICIENCY=0.10
      - GATE_MAX_PAYMENT_REJECT_COUNT=2
      - GATE_PENALTY_POINTS=4.0
      - GATE_GLOBAL_PAYMENT_PENALTY_POINTS=2.0
      
      # Evolution
      - EVOLUTION_ELITE_PERCENTAGE=0.1
      - EVOLUTION_MUTATION_RATE=0.1
      - EVOLUTION_IMMIGRANT_RATIO=0.1
      
      # League - momentalne vypnuto aby sme najpr generizovali
      - LEAGUE_ENABLE=false
      - TRAINING_POOL_GENERATION_WINDOW=20
      - TRAINING_POOL_GAMES_PER_AGENT=2
      - FIXED_BENCHMARK_INTERVAL=3
      
      # System
      - MIN_EVAL_COMPLETION_RATIO=0.80
      - MIN_FROZEN_POOL_COMPLETION_RATE=0.90
      - INVALID_GENERATION_BACKOFF_SEC=5
      - CLEAR_ROLLOUT_BUFFER_ON_INVALID_GENERATION=1
      - AGENT_POLL_INTERVAL_SEC=0.25
      - AGENT_POST_MOVE_SLEEP_SEC=0.0
      - AGENT_FAILURE_PAUSE_SEC=0.1

    depends_on:
      - tfm-server-1
      - tfm-server-2
      - tfm-server-3
      - tfm-server-4
      - tfm-server-5
      - tfm-server-6
      - tfm-server-7
      - tfm-server-8
      - tfm-server-9
      - tfm-server-10
      - redis
      - postgres
      
    ports:
      - "5000:5000"  # Dashboard port

volumes:
  postgres_data_hard:
