services:
  # Game Server Cluster (8 instances for parallel training)
  tfm-server-1:
    build:
      context: ./terraforming-mars
      dockerfile: Dockerfile.rl
    ports:
      - "8081:8080"
    environment:
      - NODE_ENV=production
      - COMPRESS_COMPLETED_GAMES_DAYS=0
      - SERVER_ID=tfm-server-1
    tmpfs:
      - /usr/src/app/db:uid=100,gid=65533,mode=0775
    labels:
      - autoheal=true
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:8080/',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped

