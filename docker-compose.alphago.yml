services:
  tfm-server-1: &alphago_server
    environment:
      - RL_ALLOW_FIXED_SEED=1
      - RL_RECYCLE_ENABLED=1
      - RL_CONTROL_TOKEN=${TFM_RL_CONTROL_TOKEN:-tfm-alphago-local-recycle}
      - RL_SEARCH_ENABLED=${ALPHAGO_RL_SEARCH_ENABLED:-0}
      - RL_SEARCH_SHADOW_VALIDATE=${ALPHAGO_RL_SEARCH_SHADOW_VALIDATE:-0}
      - RL_SEARCH_TRACE_VALIDATE=${ALPHAGO_RL_SEARCH_TRACE_VALIDATE:-0}
      - RL_SEARCH_DETERMINIZATION_ENABLED=${ALPHAGO_RL_SEARCH_DETERMINIZATION_ENABLED:-0}
      - GAME_CACHE=sweep=auto;eviction_age=2m;sweep_freq=1m
      - MAX_GAME_DAYS=1
  tfm-server-2: *alphago_server
  tfm-server-3: *alphago_server
  tfm-server-4: *alphago_server

  postgres:
    environment:
      - POSTGRES_DB=tfm_rl_alphago
    volumes:
      - postgres_data_alphago:/var/lib/postgresql/data

  rl-coordinator:
    restart: "no"
    command:
      - python
      - -m
      - training.v2_self_play
      - --from-scratch
      - --root
      - /app/alphago
      - --max-decisions
      - ${ALPHAGO_MAX_DECISIONS:-10000000}
      - --benchmark-interval
      - ${ALPHAGO_BENCHMARK_INTERVAL:-100000}
      - --seed
      - ${ALPHAGO_SEED:-800000}
      - --stage
      - "1"
    volumes:
      - ./rl-environment:/app
      - ./rl-alphago:/app/alphago
      - ./card_metadata.json:/app/card_metadata.json:ro
    environment:
      - TFM_RL_V2=1
      - TFM_RL_V3=0
      - TFM_RL_V4=0
      - V2_RECYCLE_IDLE_SERVERS=0
      - RL_CONTROL_TOKEN=${TFM_RL_CONTROL_TOKEN:-tfm-alphago-local-recycle}
      - TFM_RL_V2_ROOT=/app/alphago
      - V2_ALLOW_RESUME=1
      - V2_ALLOW_STAGE1=1
      - RESUME_TRAINING=0
      - BOOTSTRAP_CHECKPOINT_PATH=
      - RL_MODELS_DIR=/app/alphago/models
      - RL_CHECKPOINT_DIR=/app/alphago/checkpoints
      - PPO_ROLLOUT_SHARD_DIR=/app/alphago/rollouts
      - V2_TEACHER_DATASET_DIR=/app/alphago/teacher-dataset
      - V2_BENCHMARK_DIR=/app/alphago/benchmarks
      - V2_METRICS_DIR=/app/alphago/metrics
      - RL_LOG_DIR=/app/alphago/logs
      - POSTGRES_URL=postgresql://tfm:tfm_password@postgres:5432/tfm_rl_alphago
      - GAME_OPTIONS_FILE=/app/game_options.v2_stage1.json
      - STATE_SCHEMA_VERSION=v2
      - PPO_GAMMA=1.0
      - PPO_GAE_LAMBDA=0.95
      - PPO_EPOCHS=${ALPHAGO_PPO_EPOCHS:-2}
      - PPO_CLIP_EPS=0.10
      - PPO_VALUE_CLIP_EPS=0.10
      - PPO_TARGET_KL=0.01
      - PPO_ENTROPY_COEF_START=0.005
      - PPO_ENTROPY_COEF_END=0.001
      - PPO_ENTROPY_COEF_ANNEAL_GAMES=3000
      - PPO_RARE_STATE_PRIORITY_ENABLED=0
      - PPO_SHAPING_INITIAL_COEF=0.20
      - PPO_SHAPING_FINAL_COEF=0.05
      - PPO_SHAPING_ANNEAL_GAMES=3000
      - PPO_SHAPING_MILESTONES_WEIGHT=2.3
      - PPO_SHAPING_AWARDS_WEIGHT=1.0
      - PPO_SHAPING_AWARD_RANK_DROP_WEIGHT=1.5
      - PPO_STRICT_ON_POLICY=1
      - PPO_ROLLOUT_STEPS=${ALPHAGO_PPO_ROLLOUT_STEPS:-12288}
      # 512 exhausts the 6 GB RTX 3060 on high-branching planner batches.
      - PPO_MINIBATCH_SIZE=${ALPHAGO_PPO_MINIBATCH_SIZE:-128}
      # CPU is only an emergency path; keep its activation footprint bounded
      # so a CUDA OOM cannot escalate into Docker OOM-kill (exit 137).
      - PPO_CPU_FALLBACK_MINIBATCH_SIZE=${ALPHAGO_PPO_CPU_FALLBACK_MINIBATCH_SIZE:-16}
      - PPO_LEARNING_RATE=0.00005
      - PPO_LR_MIN=0.00001
      - PPO_LR_MAX=0.00005
      - BENCHMARK_SCREEN_MIN_COMPLETION_RATIO=${ALPHAGO_SCREEN_MIN_COMPLETION_RATIO:-0.90}
      - BENCHMARK_SCREEN_TEACHER_MIN_FIRST_PLACE_RATE=${ALPHAGO_SCREEN_TEACHER_MIN_FIRST_PLACE_RATE:-0.25}
      - BENCHMARK_SCREEN_CHAMPION_MIN_PAIRWISE_SCORE=${ALPHAGO_SCREEN_CHAMPION_MIN_PAIRWISE_SCORE:-0.50}
      - HISTORY_SNAPSHOT_INTERVAL_UPDATES=${ALPHAGO_HISTORY_SNAPSHOT_INTERVAL_UPDATES:-8}
      - SELFPLAY_LIVE_FRACTION=${ALPHAGO_SELFPLAY_LIVE_FRACTION:-0.40}
      - SELFPLAY_CHAMPION_FRACTION=${ALPHAGO_SELFPLAY_CHAMPION_FRACTION:-0.20}
      - SELFPLAY_HISTORY_FRACTION=${ALPHAGO_SELFPLAY_HISTORY_FRACTION:-0.20}
      - SELFPLAY_TEACHER_FRACTION=${ALPHAGO_SELFPLAY_TEACHER_FRACTION:-0.20}
      - PROMOTION_TEACHER_PAIRWISE_MARGIN=${ALPHAGO_PROMOTION_TEACHER_PAIRWISE_MARGIN:-0.0}
      - PPO_ROLLBACK_PAIRWISE_FLOOR=${ALPHAGO_ROLLBACK_PAIRWISE_FLOOR:-0.35}
      - PPO_ROLLBACK_FAILURE_LIMIT=${ALPHAGO_ROLLBACK_FAILURE_LIMIT:-2}
      - PPO_ROLLBACK_CONFIRM_FULL=${ALPHAGO_ROLLBACK_CONFIRM_FULL:-1}
      - PPO_ROLLBACK_CONFIRM_PAIRWISE=${ALPHAGO_ROLLBACK_CONFIRM_PAIRWISE:-0.45}
      - BENCHMARK_CANDIDATE_STOCHASTIC=${ALPHAGO_BENCHMARK_CANDIDATE_STOCHASTIC:-1}
      - SELFPLAY_CONCURRENCY=4
      - BENCHMARK_CONCURRENCY=4
      - MAX_ACTIVE_GAMES_PER_SERVER=1
      - AGENT_MAX_EPISODE_STEPS=10000
      - ALPHAGO_SEARCH_ENABLED=${ALPHAGO_SEARCH_ENABLED:-0}
      - ALPHAGO_SEARCH_MODE=${ALPHAGO_SEARCH_MODE:-lookahead}
      - ALPHAGO_SEARCH_TOP_K=${ALPHAGO_SEARCH_TOP_K:-8}
      - ALPHAGO_SEARCH_DETERMINIZATIONS=${ALPHAGO_SEARCH_DETERMINIZATIONS:-8}
      - ALPHAGO_SEARCH_SIMULATIONS=${ALPHAGO_SEARCH_SIMULATIONS:-32}
      - ALPHAGO_SEARCH_ADAPTIVE_SIMULATIONS=${ALPHAGO_SEARCH_ADAPTIVE_SIMULATIONS:-1}
      - ALPHAGO_SEARCH_SIMULATIONS_TWO_ACTIONS=${ALPHAGO_SEARCH_SIMULATIONS_TWO_ACTIONS:-8}
      - ALPHAGO_SEARCH_SIMULATIONS_FOUR_ACTIONS=${ALPHAGO_SEARCH_SIMULATIONS_FOUR_ACTIONS:-16}
      - ALPHAGO_SEARCH_LEAF_BATCH=${ALPHAGO_SEARCH_LEAF_BATCH:-32}
      - ALPHAGO_SEARCH_EARLY_STOP=${ALPHAGO_SEARCH_EARLY_STOP:-1}
      - ALPHAGO_SEARCH_EARLY_STOP_MIN_SIMULATIONS=${ALPHAGO_SEARCH_EARLY_STOP_MIN_SIMULATIONS:-16}
      - ALPHAGO_SEARCH_DEPTH=${ALPHAGO_SEARCH_DEPTH:-2}
      - ALPHAGO_SEARCH_PUCT_C=${ALPHAGO_SEARCH_PUCT_C:-1.5}
      - ALPHAGO_SEARCH_SELECTION=${ALPHAGO_SEARCH_SELECTION:-argmax}
      - ALPHAGO_SEARCH_ROOT_NOISE_WEIGHT=${ALPHAGO_SEARCH_ROOT_NOISE_WEIGHT:-0}
      - ALPHAGO_SEARCH_ROOT_PROMPTS=${ALPHAGO_SEARCH_ROOT_PROMPTS:-or,card,space,initialcards}
      - ALPHAGO_SEARCH_SELFPLAY_FRACTION=${ALPHAGO_SEARCH_SELFPLAY_FRACTION:-0}
      - ALPHAGO_SEARCH_REPLAY_DIR=${ALPHAGO_SEARCH_REPLAY_DIR:-/app/alphago/search-replay}
      - ALPHAGO_SEARCH_REPLAY_MAX_SHARDS=${ALPHAGO_SEARCH_REPLAY_MAX_SHARDS:-2048}
      - ALPHAGO_SEARCH_REPLAY_MAX_INVALID_RATE=${ALPHAGO_SEARCH_REPLAY_MAX_INVALID_RATE:-0.10}
      - ALPHAGO_SEARCH_SELFPLAY_SELECTION=${ALPHAGO_SEARCH_SELFPLAY_SELECTION:-temperature}
      - ALPHAGO_SEARCH_SELFPLAY_TEMPERATURE=${ALPHAGO_SEARCH_SELFPLAY_TEMPERATURE:-1.0}
      - ALPHAGO_SEARCH_SELFPLAY_TEMPERATURE_GENERATIONS=${ALPHAGO_SEARCH_SELFPLAY_TEMPERATURE_GENERATIONS:-4}
      - ALPHAGO_SEARCH_SELFPLAY_ROOT_NOISE_ALPHA=${ALPHAGO_SEARCH_SELFPLAY_ROOT_NOISE_ALPHA:-0.05}
      - ALPHAGO_SEARCH_SELFPLAY_ROOT_NOISE_WEIGHT=${ALPHAGO_SEARCH_SELFPLAY_ROOT_NOISE_WEIGHT:-0.25}
      - AGENT_STARTUP_AUTOSUBMIT=0
      - AGENT_STARTUP_PLAN_SELECTION=best
      - AGENT_HIDDEN_SIZE=512
      - AGENT_RECURRENT_SIZE=128
      - AGENT_TRANSFORMER_HEADS=4
      - AGENT_TRANSFORMER_LAYERS=3
      - LEAGUE_ENABLE=0
      - EVOLUTION_IMMIGRANT_RATIO=0.0
      - FIXED_BENCHMARK_ENABLED=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

volumes:
  postgres_data_alphago:
