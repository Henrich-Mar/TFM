services:
  # Game Server Cluster (6 instances — fewer servers with more memory each)
  # With 9.4GB total Docker memory, 6×1.3GB = 7.8GB for servers + ~1.6GB for
  # redis/postgres/coordinator.  Each server comfortably handles 3 concurrent
  # games with 896MB V8 heap.
  tfm-server-1:
    build:
      context: ./terraforming-mars
      dockerfile: ../Dockerfile.rl
    ports:
      - "8081:8080"
    environment:
      - NODE_ENV=production
      - COMPRESS_COMPLETED_GAMES_DAYS=0
      - SERVER_ID=tfm-server-1
      - NODE_OPTIONS=--max-old-space-size=640
    tmpfs:
      - /usr/src/app/db:uid=100,gid=65533,mode=0775
    labels:
      - autoheal=true
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:8080/',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 45s
    mem_limit: 1000m
    restart: unless-stopped

  tfm-server-2:
    build:
      context: ./terraforming-mars
      dockerfile: ../Dockerfile.rl
    ports:
      - "8082:8080"
    environment:
      - NODE_ENV=production
      - COMPRESS_COMPLETED_GAMES_DAYS=0
      - SERVER_ID=tfm-server-2
      - NODE_OPTIONS=--max-old-space-size=640
    tmpfs:
      - /usr/src/app/db:uid=100,gid=65533,mode=0775
    labels:
      - autoheal=true
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:8080/',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 45s
    mem_limit: 1000m
    restart: unless-stopped

  tfm-server-3:
    build:
      context: ./terraforming-mars
      dockerfile: ../Dockerfile.rl
    ports:
      - "8083:8080"
    environment:
      - NODE_ENV=production
      - COMPRESS_COMPLETED_GAMES_DAYS=0
      - SERVER_ID=tfm-server-3
      - NODE_OPTIONS=--max-old-space-size=640
    tmpfs:
      - /usr/src/app/db:uid=100,gid=65533,mode=0775
    labels:
      - autoheal=true
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:8080/',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 45s
    mem_limit: 1000m
    restart: unless-stopped
    
  tfm-server-4:
    build:
      context: ./terraforming-mars
      dockerfile: ../Dockerfile.rl
    ports:
      - "8084:8080"
    environment:
      - NODE_ENV=production
      - COMPRESS_COMPLETED_GAMES_DAYS=0
      - SERVER_ID=tfm-server-4
      - NODE_OPTIONS=--max-old-space-size=640
    tmpfs:
      - /usr/src/app/db:uid=100,gid=65533,mode=0775
    labels:
      - autoheal=true
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:8080/',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 45s
    mem_limit: 1000m
    restart: unless-stopped
    
  # Automatically restart unhealthy tfm-server containers
  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=120
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      - tfm-server-1
      - tfm-server-2
      - tfm-server-3
      - tfm-server-4

  # Redis for job queue and caching
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Database for metrics
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=tfm
      - POSTGRES_PASSWORD=tfm_password
      - POSTGRES_DB=tfm_rl
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data_hard:/var/lib/postgresql/data

  # RL Coordinator - Manages training loop (GPU-accelerated PPO)
  rl-coordinator:
    build:
      context: ./rl-environment
      dockerfile: Dockerfile.training
    restart: unless-stopped
    # GPU passthrough for PPO training on NVIDIA RTX 3060.
    # Requires: NVIDIA Container Toolkit (nvidia-ctk) installed on host.
    # Install: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./rl-environment:/app
      - ./rl-models:/app/rl-models
      - ./rl-logs:/app/logs
      - ./card_metadata.json:/app/card_metadata.json:ro
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql://tfm:tfm_password@postgres:5432/tfm_rl
      # 6 game servers (down from 8 — more memory per server)
      - GAME_SERVERS=tfm-server-1:8080,tfm-server-2:8080,tfm-server-3:8080,tfm-server-4:8080
      - PUBLIC_TM_MAP=tfm-server-1:8080=http://localhost:8081,tfm-server-2:8080=http://localhost:8082,tfm-server-3:8080=http://localhost:8083,tfm-server-4:8080=http://localhost:8084
      - PUBLIC_TM_SERVER_ID_MAP=tfm-server-1:8080=tfm-server-1,tfm-server-2:8080=tfm-server-2,tfm-server-3:8080=tfm-server-3,tfm-server-4:8080=tfm-server-4
      - PUBLIC_TM_URL=http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084
      - INTERNAL_TM_URL=http://tfm-server-1:8080,http://tfm-server-2:8080,http://tfm-server-3:8080,http://tfm-server-4:8080
      - POPULATION_SIZE=4
      - TOURNAMENT_SIZE=4
      - GENERATIONS=5000
      - GAMES_PER_EVAL=16
      # Concurrency: 6 servers × 3 games/server = 18 max capacity
      # GLOBAL_GAME_CONCURRENCY=18 uses full capacity; set to 18 for headroom
      - TOURNAMENT_CONCURRENCY=6
      - GLOBAL_GAME_CONCURRENCY=6
      - MAX_ACTIVE_GAMES_PER_SERVER=2
      - GAME_OPTIONS_FILE=/app/game_options.base_prelude.json
      # Timeouts & transport
      - TM_GAME_TIMEOUT_SEC=720
      - TM_HTTP_CONNECTOR_LIMIT=160
      - TM_HTTP_CONNECTOR_LIMIT_PER_HOST=30
      - TM_HTTP_FORCE_CLOSE_CONNECTIONS=1
      - TM_SEND_INPUT_TRANSPORT_RETRY_ATTEMPTS=4
      - TM_SEND_INPUT_TRANSPORT_RETRY_ATTEMPTS_INITIAL=5
      - TM_SEND_INPUT_INITIAL_CARDS_JITTER_MS=1200
      - TM_VALIDATE_INITIAL_CARDS_BEFORE_SEND=1
      - TM_SKIP_STALE_INITIAL_CARDS_SEND=1
      - TM_RECYCLE_SESSION_ON_DISCONNECT=1
      - TM_CREATE_GAME_RETRY_ATTEMPTS=5
      - TM_CREATE_GAME_RETRY_BACKOFF_SEC=1.0
      - TM_SERVER_FAILURE_COOLDOWN_SEC=30
      - TM_HEALTH_CHECK_INTERVAL_SEC=15
      - TM_SERVER_HEALTH_TIMEOUT_SEC=5
      - TM_SERVER_SLOT_WAIT_TIMEOUT_SEC=60
      - TM_FAST_MODE_OPTION=1
      - RL_MODELS_DIR=/app/rl-models
      - RL_CHECKPOINT_DIR=/app/rl-models/checkpoints
      - TM_CARD_METADATA_PATH=/app/card_metadata.json
      - AGENT_INFERENCE_DEVICE=cpu
      - PPO_DEVICE=cuda
      - PPO_PARALLEL_AGENTS=1
      - PPO_CUDA_MIN_FREE_MB=1024
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:128
      
      # Planner architecture (policy_mars.md)
      # Planner bundle construction.
      - AGENT_PLANNER_TOKEN_DIM=64
      - AGENT_PLANNER_GLOBAL_DIM=16
      - AGENT_PLANNER_TYPE_VOCAB_SIZE=16
      - AGENT_PLANNER_OPPORTUNITY_LIMIT=12
      - AGENT_PLANNER_TABLEAU_LIMIT=24
      - AGENT_PLANNER_HAND_LIMIT=24
      - AGENT_PLANNER_OPPONENT_LIMIT=4
      # Planner policy/value network.
      # Laptop RTX 3060-safe preset: smaller hidden width and PPO batches.
      - AGENT_HIDDEN_SIZE=768
      - AGENT_RECURRENT_SIZE=128
      - AGENT_PHASE_HEAD_COUNT=6
      - AGENT_TRANSFORMER_HEADS=12
      - AGENT_TRANSFORMER_LAYERS=4
      - AGENT_TRANSFORMER_DROPOUT=0.10
      - AGENT_PLANNER_AUX_OUTPUT_DIM=280
      
      # Scoring Mode
      - SCORING_MODE=HARD
      - SELECTION_RANK_1_POINTS=150
      - SELECTION_RANK_2_POINTS=50
      - SELECTION_RANK_3_POINTS=25
      - SELECTION_RANK_4_POINTS=5
      - SELECTION_VP_WEIGHT=0.60
      - SELECTION_WIN_RATE_WEIGHT=100
      - SELECTION_INCLUDE_TRAINING_POOL=1
      
      # PPO Core
      - PPO_ENABLE=true
      - PPO_ROLLOUT_STEPS=12288
      - PPO_DISK_SHARDING_ENABLE=1
      - PPO_DISK_SHARD_MAX_STEPS=2048
      - PPO_ROLLOUT_SHARD_DIR=/app/rl-models/ppo-rollouts
      - PPO_MIN_STEPS_PER_AGENT=1024
      - PPO_EPOCHS=8
      - PPO_MINIBATCH_SIZE=512
      - PPO_ENTROPY_COEF=0.015
      - PPO_VALUE_COEF=1.0
      - PPO_TARGET_KL=0.020
      - PPO_CLIP_EPS=0.15
      - PPO_BUFFER_MAX_STEPS=2048
      - PPO_LEARNING_RATE=0.00014
      - PPO_LR_MIN=0.00003
      - PPO_LR_MAX=0.00035
      - PPO_LR_ADAPT_UP=1.05
      - PPO_LR_ADAPT_DOWN=0.95
      - PPO_RARE_STATE_PRIORITY_ALPHA=1.2

      # PPO Entropy (more exploration, slower decay)
      - PPO_ENTROPY_COEF_START=0.030
      - PPO_ENTROPY_COEF_END=0.012
      - PPO_ENTROPY_COEF_ANNEAL_GAMES=6000

      # Reward Shaping (faster annealing, keep residual)
      - PPO_SHAPING_INITIAL_COEF=0.7
      - PPO_SHAPING_FINAL_COEF=0.15
      - PPO_SHAPING_ANNEAL_GAMES=600

      # Reward Component Weights (rebalanced)
      - PPO_SHAPING_TR_WEIGHT=2.0
      - PPO_SHAPING_CARDS_VP_WEIGHT=5.0
      - PPO_SHAPING_CITY_GREENERY_WEIGHT=3.5
      - PPO_SHAPING_MILESTONES_AWARDS_WEIGHT=3.0
      - PPO_SHAPING_OTHER_WEIGHT=0.3

      # Reward Debug
      - PPO_REWARD_DEBUG_ENABLED=1
      - PPO_REWARD_DEBUG_THRESHOLD=0.001
      - PPO_REWARD_DEBUG_LOG_EVERY=2000

      # Promotion Gates (stricter than defaults)
      - PROMOTION_GATE_ENABLED=true
      - GATE_MIN_CARD_PLAYS_PER_GAME=20.0
      - GATE_MAX_STANDARD_PROJECT_RATIO=0.35
      - GATE_MIN_STEEL_SPENT_PER_GAME=8.0
      - GATE_MIN_TITANIUM_SPENT_PER_GAME=4.0
      - GATE_MIN_STEEL_CONVERSION_EFFICIENCY=0.15
      - GATE_MIN_TITANIUM_CONVERSION_EFFICIENCY=0.12
      - GATE_MAX_PAYMENT_REJECT_COUNT=2
      - GATE_PENALTY_POINTS=4.0
      - GATE_GLOBAL_PAYMENT_PENALTY_POINTS=2.0
      
      # Evolution (higher diversity for fresh start)
      - EVOLUTION_ELITE_PERCENTAGE=0.1
      - EVOLUTION_MUTATION_RATE=0.20
      - EVOLUTION_IMMIGRANT_RATIO=0.15
      
      # League - momentalne vypnuto aby sme najpr generizovali
      - LEAGUE_ENABLE=true
      - TRAINING_POOL_GENERATION_WINDOW=10
      - TRAINING_POOL_GAMES_PER_AGENT=0
      
      - FIXED_BENCHMARK_INTERVAL=3
      
      # System
      - MIN_EVAL_COMPLETION_RATIO=0.80
      - MIN_FROZEN_POOL_COMPLETION_RATE=0.90
      - INVALID_GENERATION_BACKOFF_SEC=5
      - CLEAR_ROLLOUT_BUFFER_ON_INVALID_GENERATION=1
      - AGENT_POLL_INTERVAL_SEC=0.50
      - AGENT_POST_MOVE_SLEEP_SEC=0.0
      - AGENT_FAILURE_PAUSE_SEC=0.2
      - AGENT_INITIAL_CARDS_FALLBACK_MAX_ATTEMPTS=1
      - AGENT_INITIAL_CARDS_REJECT_PAUSE_SEC=0.5
      - AGENT_STARTUP_SEAT_STAGGER_MS=10
      - AGENT_STARTUP_AUTOSUBMIT=1
      - AGENT_STARTUP_PLAN_RANDOM_TOP_K=1
      - AGENT_STARTUP_PLAN_SELECTION=legacy

    depends_on:
      - tfm-server-1
      - tfm-server-2
      - tfm-server-3
      - tfm-server-4
      - redis
      - postgres
      
    ports:
      - "5000:5000"  # Dashboard port

volumes:
  postgres_data_hard:
